<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猫棋 · 地图生成器</title>
<style>
  :root { --ink: #3d3a4a; --sub: #8a8699; --line: #ece9f3; --brand: #f2789f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: #faf9fc; padding: 16px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  header h1 { font-size: 20px; }
  header a { color: var(--sub); font-size: 13px; text-decoration: none; }
  header a:hover { color: var(--brand); }
  .wrap { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .panel h2 { font-size: 13px; color: var(--sub); font-weight: 600; margin-bottom: 10px; }
  .field { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; }
  .field label { min-width: 64px; color: var(--sub); }
  .field input[type=number] { width: 84px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
  .field input[type=checkbox] { width: 16px; height: 16px; }
  .hint { font-size: 12px; color: var(--sub); }
  button { border: none; border-radius: 10px; font-size: 15px; cursor: pointer; }
  #genBtn { width: 100%; padding: 12px; margin-top: 4px; background: var(--brand); color: #fff; font-weight: 600; }
  #genBtn:disabled { background: #d8d4e2; cursor: wait; }
  #exportBtn { padding: 8px 12px; background: #efeaf6; color: var(--ink); font-size: 13px; margin-top: 8px; width: 100%; }
  #exportBtn:disabled { opacity: .5; cursor: default; }
  #progress { font-size: 12px; color: var(--sub); margin-top: 8px; min-height: 16px; }
  #stats { font-size: 13px; line-height: 1.9; margin-bottom: 8px; }
  #stats b { font-weight: 600; }
  #stats .ok { color: #2e9e5b; }
  #boardBox { padding: 14px; }
  #board { display: grid; gap: 2px; }
  #board .cell { border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  #board .cell.forced::after { content: "•"; color: rgba(0,0,0,.45); font-size: 11px; }
  #board .cell.cat { font-size: 15px; }
  #empty { color: var(--sub); font-size: 14px; padding: 40px 20px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>🐱 猫棋 · 地图生成器</h1>
  <a href="index.html">← 返回游戏</a>
</header>

<div class="wrap">
  <div class="panel" style="width: 260px">
    <h2>生成参数（配置同 engine/src/genconfig.js）</h2>
    <div class="field"><label>棋盘</label>
      <select id="sizeSel"></select><span class="hint" id="sizeHint"></span></div>
    <div class="field"><label>目标难度</label><input id="targetIn" type="number" min="1" max="100" value="60"><span class="hint">1~100</span></div>
    <div class="field"><label>种子</label><input id="seedIn" type="number" placeholder="留空随机"><span class="hint">可复现</span></div>
    <div class="field"><label>显示解</label><input id="showSol" type="checkbox"></div>
    <div class="field"><label>强制格</label><input id="showForced" type="checkbox" checked></div>
    <button id="genBtn">生成地图</button>
    <div id="progress"></div>
    <button id="exportBtn" disabled>导出 JSON</button>
    <p class="hint" style="margin-top:8px">正式关卡入库请走 CLI：<code>node engine/cli.js gen --id N --size S --target D --seed B</code></p>
  </div>

  <div class="panel" id="boardBox">
    <h2>生成结果</h2>
    <div id="stats">点击「生成地图」开始</div>
    <div id="board"></div>
  </div>
</div>

<!-- 引擎（UMD，与游戏页/CLI/小程序同源；生成配置单一来源 genconfig.js） -->
<script src="../engine/src/core.js"></script>
<script src="../engine/src/solver.js"></script>
<script src="../engine/src/hint.js"></script>
<script src="../engine/src/difficulty.js"></script>
<script src="../engine/src/generator.js"></script>
<script src="../engine/src/genconfig.js"></script>
<script src="gen.js"></script>
</body>
</html>
